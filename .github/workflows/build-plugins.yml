name: Build Vaporizer2 VST3 and AU

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-plugins.yml'
      - 'CMakeLists.txt'
      - 'VASTvaporizer/**'
      - 'JUCE'
      - '.gitmodules'
      - 'fftw-3.3.10/**'

permissions:
  contents: read

jobs:
  vst3-windows:
    name: Windows x64 VST3
    runs-on: windows-2022
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_AVX=OFF -DBUILD_32=OFF
      - name: Build VST3
        run: cmake --build build --config Release --target VASTvaporizer2_VST3 --parallel 2
      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: Vaporizer2-VST3-Windows-x64
          path: build/VASTvaporizer2_artefacts/Release/VST3/VASTvaporizer2.vst3
          if-no-files-found: error
          retention-days: 14

  plugins-macos:
    name: macOS universal VST3 + AU
    runs-on: macos-14
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 -DBUILD_AVX=OFF -DBUILD_32=OFF
      - name: Build VST3
        run: cmake --build build --config Release --target VASTvaporizer2_VST3 --parallel 2
      - name: Build AU
        run: cmake --build build --config Release --target VASTvaporizer2_AU --parallel 2
      - name: Upload macOS VST3 and AU
        uses: actions/upload-artifact@v4
        with:
          name: Vaporizer2-VST3-AU-macOS-universal
          path: |
            build/VASTvaporizer2_artefacts/Release/VST3/VASTvaporizer2.vst3
            build/VASTvaporizer2_artefacts/Release/AU/VASTvaporizer2.component
          if-no-files-found: error
          retention-days: 14
